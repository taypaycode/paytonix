name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-seo:
    name: Lint, build, and SEO regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: HubSpot form unit tests
        run: npm test
        env:
          NEXT_PUBLIC_HUBSPOT_PORTAL_ID: "247279773"
          NEXT_PUBLIC_HUBSPOT_ASSESSMENT_FORM_ID: "fb1b9952-c198-4e8f-b68a-7295fd752904"
          NEXT_PUBLIC_HUBSPOT_MARTECHOS_BETA_FORM_ID: "ba5bb7a9-3b91-45b8-b462-e613040e1cf0"

      - name: Lint
        run: npm run lint

      - name: Build (simulating a production deployment)
        run: npm run build
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_HUBSPOT_PORTAL_ID: "247279773"
          NEXT_PUBLIC_HUBSPOT_ASSESSMENT_FORM_ID: "fb1b9952-c198-4e8f-b68a-7295fd752904"
          NEXT_PUBLIC_HUBSPOT_MARTECHOS_BETA_FORM_ID: "ba5bb7a9-3b91-45b8-b462-e613040e1cf0"

      - name: Start production server
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: SEO regression checks (robots, sitemap, titles, canonicals, H1, JSON-LD, broken links)
        run: npm run validate:seo -- http://localhost:3000

      - name: HubSpot form production wiring checks
        run: npm run validate:forms -- http://localhost:3000
        env:
          EXPECTED_HUBSPOT_PORTAL_ID: "247279773"
          EXPECTED_HUBSPOT_ASSESSMENT_FORM_ID: "fb1b9952-c198-4e8f-b68a-7295fd752904"
          EXPECTED_HUBSPOT_MARTECHOS_BETA_FORM_ID: "ba5bb7a9-3b91-45b8-b462-e613040e1cf0"

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: lint-build-seo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (simulating a production deployment)
        run: npm run build
        env:
          VERCEL_ENV: production
          NEXT_PUBLIC_HUBSPOT_PORTAL_ID: "247279773"
          NEXT_PUBLIC_HUBSPOT_ASSESSMENT_FORM_ID: "fb1b9952-c198-4e8f-b68a-7295fd752904"
          NEXT_PUBLIC_HUBSPOT_MARTECHOS_BETA_FORM_ID: "ba5bb7a9-3b91-45b8-b462-e613040e1cf0"

      - name: Start production server
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: Run Lighthouse CI
        run: npx @lhci/cli autorun
        env:
          LHCI_BUILD_CONTEXT__CURRENT_HASH: ${{ github.sha }}
