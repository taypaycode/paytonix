name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint-build-seo:
    name: Lint, build, and SEO regression checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build (simulating a production deployment)
        run: npm run build
        env:
          VERCEL_ENV: production

      - name: Start production server
        run: npm run start &
        env:
          PORT: 3000

      - name: Wait for server
        run: npx wait-on http://localhost:3000 --timeout 30000

      - name: SEO regression checks (robots, sitemap, titles, canonicals, H1, JSON-LD, broken links)
        run: npm run validate:seo -- http://localhost:3000

  lighthouse:
    name: Lighthouse CI
    runs-on: ubuntu-latest
    needs: lint-build-seo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build (simulating a production deployment)
        run: npm run build
        env:
          VERCEL_ENV: production

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            http://localhost:3000/
            http://localhost:3000/revenue-data-integrity-assessment
            http://localhost:3000/about
            http://localhost:3000/insights/why-crm-and-warehouse-revenue-disagree
          startServerCommand: "npm run start"
          startServerReadyPattern: "Ready in"
          uploadArtifacts: true
          temporaryPublicStorage: true
          configPath: "./lighthouserc.json"
